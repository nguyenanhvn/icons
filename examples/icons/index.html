<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agribank UI Icons</title>

    <link
        rel="stylesheet"
        href="../../dist/icons/ak-icons.css"
    >

    <style>
        :root {
            --page-bg: #f6f7f9;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-hover: #d1d5db;

            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;

            --brand: #a71930;
            --brand-hover: #8f1529;
            --brand-light: #fdf0f2;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --shadow-sm:
                0 1px 2px rgba(0, 0, 0, 0.04);

            --shadow-md:
                0 4px 12px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--page-bg);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: min(1440px, calc(100% - 48px));
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .page-header {
            margin-bottom: 28px;
        }

        .page-title {
            margin: 0;

            font-size: 28px;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-description {
            margin: 8px 0 0;

            color: var(--text-secondary);

            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 20px;
        }

        .search {
            position: relative;

            flex: 1;
            max-width: 480px;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 14px;

            transform: translateY(-50%);

            color: var(--text-muted);

            font-size: 18px;

            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 44px;

            padding: 0 16px 0 44px;

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-size: 14px;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--brand);

            box-shadow:
                0 0 0 3px rgba(167, 25, 48, 0.08);
        }

        .toolbar-count {
            flex-shrink: 0;

            color: var(--text-secondary);

            font-size: 13px;
        }

        .toolbar-count strong {
            color: var(--text);
            font-weight: 600;
        }

        /* =========================================================
           TABS
        ========================================================= */

        .tabs-wrapper {
            margin-bottom: 24px;

            border-bottom: 1px solid var(--border);
        }

        .tabs {
            display: flex;
            align-items: stretch;
            gap: 4px;

            overflow-x: auto;
            overflow-y: hidden;

            scrollbar-width: thin;
        }

        .tabs::-webkit-scrollbar {
            height: 4px;
        }

        .tabs::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: #d1d5db;
        }

        .tab {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            min-height: 44px;
            padding: 0 14px;

            border: 0;

            background: transparent;
            color: var(--text-secondary);

            font: inherit;
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            white-space: nowrap;

            transition:
                color 0.15s ease,
                background 0.15s ease;
        }

        .tab:hover {
            color: var(--text);
            background: rgba(0, 0, 0, 0.025);
        }

        .tab.is-active {
            color: var(--brand);
            font-weight: 600;
        }

        .tab.is-active::after {
            content: "";

            position: absolute;
            right: 8px;
            bottom: -1px;
            left: 8px;

            height: 2px;

            border-radius: 2px 2px 0 0;

            background: var(--brand);
        }

        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 22px;
            height: 20px;

            margin-left: 7px;
            padding: 0 6px;

            border-radius: 999px;

            background: #f1f3f5;
            color: var(--text-muted);

            font-size: 11px;
            font-weight: 600;
        }

        .tab.is-active .tab-count {
            background: var(--brand-light);
            color: var(--brand);
        }

        /* =========================================================
           GROUP
        ========================================================= */

        .icon-group {
            margin-bottom: 36px;
        }

        .group-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;

            margin-bottom: 14px;
        }

        .group-title {
            margin: 0;

            font-size: 17px;
            line-height: 1.4;
            font-weight: 650;
        }

        .group-count {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* =========================================================
           GRID
        ========================================================= */

        .icon-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(150px, 1fr)
                );

            gap: 12px;
        }

        /* =========================================================
           ICON CARD
        ========================================================= */

        .icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 142px;
            padding: 20px 12px 16px;

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            background: var(--surface);

            cursor: pointer;

            text-align: center;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        .icon-card:hover {
            border-color: var(--border-hover);

            box-shadow: var(--shadow-md);

            transform: translateY(-1px);
        }

        .icon-card:active {
            transform: translateY(0);
        }

        .icon-preview {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 64px;
            height: 64px;

            margin-bottom: 14px;

            border-radius: var(--radius-md);

            background: #f8f9fa;

            color: var(--text);

            font-size: 30px;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .icon-card:hover .icon-preview {
            background: var(--brand-light);
            color: var(--brand);
        }

        .icon-name {
            width: 100%;

            overflow: hidden;

            color: var(--text);

            font-size: 12px;
            line-height: 1.5;
            font-weight: 600;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-class {
            width: 100%;

            margin-top: 3px;

            overflow: hidden;

            color: var(--text-muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 10px;
            line-height: 1.4;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================================================
           EMPTY
        ========================================================= */

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 260px;

            padding: 40px;

            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);

            background: var(--surface);

            text-align: center;
        }

        .empty-icon {
            margin-bottom: 14px;

            color: var(--text-muted);

            font-size: 36px;
        }

        .empty-title {
            margin: 0;

            font-size: 15px;
            font-weight: 600;
        }

        .empty-description {
            margin: 6px 0 0;

            color: var(--text-secondary);

            font-size: 13px;
        }

        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 300px;

            color: var(--text-secondary);

            font-size: 14px;
        }

        /* =========================================================
           ERROR
        ========================================================= */

        .error {
            padding: 20px;

            border: 1px solid #f1c4cc;
            border-radius: var(--radius-md);

            background: #fff6f7;

            color: #8f1529;

            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;

            z-index: 1000;

            padding: 12px 16px;

            border-radius: var(--radius-md);

            background: #111827;
            color: #ffffff;

            font-size: 13px;
            font-weight: 500;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.15);

            opacity: 0;
            transform: translateY(10px);

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 768px) {
            .page {
                width: min(100% - 24px, 1440px);
                padding-top: 24px;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                max-width: none;
            }

            .toolbar-count {
                text-align: right;
            }

            .icon-grid {
                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(120px, 1fr)
                    );
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 24px;
            }

            .icon-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .icon-card {
                min-height: 132px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="page-header">

        <h1 class="page-title">
            Agribank UI Icons
        </h1>

        <p class="page-description">
            Icon library generated from SVG sources.
            Click an icon to copy its CSS class.
        </p>

    </header>


    <!-- =========================================================
         TOOLBAR
    ========================================================== -->

    <div class="toolbar">

        <div class="search">

            <i
                class="ak-icon ak-icon-system-search search-icon"
                aria-hidden="true"
            ></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="Search icons..."
                autocomplete="off"
            >

        </div>

        <div
            id="toolbarCount"
            class="toolbar-count"
        >
            Loading...
        </div>

    </div>


    <!-- =========================================================
         TABS
    ========================================================== -->

    <div class="tabs-wrapper">

        <nav
            id="tabs"
            class="tabs"
            aria-label="Icon groups"
        ></nav>

    </div>


    <!-- =========================================================
         CONTENT
    ========================================================== -->

    <main id="content">

        <div class="loading">
            Loading icons...
        </div>

    </main>

</div>


<!-- =========================================================
     TOAST
========================================================== -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

    const MANIFEST_URL =
        "../../dist/icons/manifest.json";


    /*
     * ---------------------------------------------------------
     * STATE
     * ---------------------------------------------------------
     */

    const state = {
        icons: [],
        groups: {},
        activeGroup: "all",
        search: ""
    };


    /*
     * ---------------------------------------------------------
     * ELEMENTS
     * ---------------------------------------------------------
     */

    const tabsElement =
        document.getElementById("tabs");

    const contentElement =
        document.getElementById("content");

    const searchInput =
        document.getElementById("searchInput");

    const toolbarCount =
        document.getElementById("toolbarCount");

    const toastElement =
        document.getElementById("toast");


    /*
     * ---------------------------------------------------------
     * HELPERS
     * ---------------------------------------------------------
     */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function normalize(value) {

        return String(value || "")
            .toLowerCase()
            .trim();

    }


    function formatGroupName(group) {

        return String(group)
            .split("-")
            .map(
                word =>
                    word.charAt(0).toUpperCase() +
                    word.slice(1)
            )
            .join(" ");

    }


    function showToast(message) {

        toastElement.textContent = message;

        toastElement.classList.add(
            "is-visible"
        );

        clearTimeout(
            showToast.timer
        );

        showToast.timer = setTimeout(() => {

            toastElement.classList.remove(
                "is-visible"
            );

        }, 1800);

    }


    /*
     * ---------------------------------------------------------
     * LOAD MANIFEST
     * ---------------------------------------------------------
     */

    async function loadManifest() {

        try {

            const response =
                await fetch(MANIFEST_URL);

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status} - ${response.statusText}`
                );

            }

            const manifest =
                await response.json();

            if (
                !manifest ||
                !Array.isArray(manifest.icons)
            ) {

                throw new Error(
                    "manifest.json does not contain a valid icons array."
                );

            }

            state.icons =
                manifest.icons;

            buildGroups();

            renderTabs();

            renderContent();

            updateToolbarCount();

        } catch (error) {

            console.error(
                "Failed to load icon manifest:",
                error
            );

            tabsElement.innerHTML = "";

            contentElement.innerHTML = `
                <div class="error">
                    <strong>
                        Failed to load icon manifest.
                    </strong>
                    <br>
                    ${escapeHtml(error.message)}
                    <br><br>
                    Make sure you are running this page
                    through a local web server instead of
                    opening the HTML file directly with
                    <code>file://</code>.
                </div>
            `;

            toolbarCount.textContent =
                "Unable to load icons";

        }

    }


    /*
     * ---------------------------------------------------------
     * BUILD GROUPS
     * ---------------------------------------------------------
     *
     * Group is taken directly from:
     *
     * manifest.icons[].group
     *
     */

    function buildGroups() {

        const groups = {};

        for (const icon of state.icons) {

            const group =
                icon.group || "other";

            if (!groups[group]) {

                groups[group] = [];

            }

            groups[group].push(icon);

        }

        /*
         * Sort icons inside each group.
         */

        for (const group of Object.keys(groups)) {

            groups[group].sort(
                (a, b) =>
                    String(a.name)
                        .localeCompare(
                            String(b.name)
                        )
            );

        }

        state.groups = groups;

    }


    /*
     * ---------------------------------------------------------
     * GET FILTERED ICONS
     * ---------------------------------------------------------
     */

    function getFilteredIcons() {

        let icons;

        if (state.activeGroup === "all") {

            icons = state.icons;

        } else {

            icons =
                state.groups[state.activeGroup] || [];

        }

        const query =
            normalize(state.search);

        if (!query) {

            return icons;

        }

        return icons.filter(icon => {

            const searchableText = [
                icon.name,
                icon.className,
                icon.group,
                icon.file
            ]
                .filter(Boolean)
                .join(" ");

            return normalize(
                searchableText
            ).includes(query);

        });

    }


    /*
     * ---------------------------------------------------------
     * RENDER TABS
     * ---------------------------------------------------------
     */

    function renderTabs() {

        const groupNames =
            Object.keys(state.groups)
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                );


        /*
         * ALL TAB
         */

        const allTab =
            createTab(
                "all",
                "All",
                state.icons.length
            );

        tabsElement.appendChild(
            allTab
        );


        /*
         * GROUP TABS
         */

        for (const group of groupNames) {

            const tab =
                createTab(
                    group,
                    formatGroupName(group),
                    state.groups[group].length
                );

            tabsElement.appendChild(
                tab
            );

        }

    }


    /*
     * ---------------------------------------------------------
     * CREATE TAB
     * ---------------------------------------------------------
     */

    function createTab(
        group,
        label,
        count
    ) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "tab";

        if (
            state.activeGroup === group
        ) {

            button.classList.add(
                "is-active"
            );

        }

        button.dataset.group =
            group;

        button.innerHTML = `
            <span>
                ${escapeHtml(label)}
            </span>

            <span class="tab-count">
                ${count}
            </span>
        `;

        button.addEventListener(
            "click",
            () => {

                state.activeGroup =
                    group;

                state.search = "";

                searchInput.value = "";

                updateActiveTab();

                renderContent();

                updateToolbarCount();

            }
        );

        return button;

    }


    /*
     * ---------------------------------------------------------
     * UPDATE ACTIVE TAB
     * ---------------------------------------------------------
     */

    function updateActiveTab() {

        const tabs =
            tabsElement.querySelectorAll(
                ".tab"
            );

        tabs.forEach(tab => {

            const isActive =
                tab.dataset.group ===
                state.activeGroup;

            tab.classList.toggle(
                "is-active",
                isActive
            );

        });

    }


    /*
     * ---------------------------------------------------------
     * RENDER CONTENT
     * ---------------------------------------------------------
     */

    function renderContent() {

        const icons =
            getFilteredIcons();


        /*
         * Empty state
         */

        if (!icons.length) {

            contentElement.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⌕
                    </div>

                    <h2 class="empty-title">
                        No icons found
                    </h2>

                    <p class="empty-description">
                        Try another search keyword.
                    </p>

                </div>
            `;

            return;

        }


        /*
         * When searching, render a single result group.
         */

        if (state.search.trim()) {

            contentElement.innerHTML = `
                <section class="icon-group">

                    <div class="group-header">

                        <h2 class="group-title">
                            Search results
                        </h2>

                        <span class="group-count">
                            ${icons.length} icon${icons.length === 1 ? "" : "s"}
                        </span>

                    </div>

                    <div class="icon-grid">
                        ${icons
                            .map(createIconCard)
                            .join("")}
                    </div>

                </section>
            `;

            return;

        }


        /*
         * ALL TAB
         *
         * Render each group separately.
         */

        if (state.activeGroup === "all") {

            const groupNames =
                Object.keys(state.groups)
                    .sort(
                        (a, b) =>
                            a.localeCompare(b)
                    );


            contentElement.innerHTML =
                groupNames
                    .map(group => {

                        const icons =
                            state.groups[group];

                        return createGroup(
                            group,
                            icons
                        );

                    })
                    .join("");

            return;

        }


        /*
         * SINGLE GROUP TAB
         */

        const group =
            state.activeGroup;

        const groupIcons =
            state.groups[group] || [];


        contentElement.innerHTML =
            createGroup(
                group,
                groupIcons
            );

    }


    /*
     * ---------------------------------------------------------
     * CREATE GROUP
     * ---------------------------------------------------------
     */

    function createGroup(
        group,
        icons
    ) {

        return `
            <section class="icon-group">

                <div class="group-header">

                    <h2 class="group-title">
                        ${escapeHtml(
                            formatGroupName(group)
                        )}
                    </h2>

                    <span class="group-count">
                        ${icons.length}
                        icon${icons.length === 1 ? "" : "s"}
                    </span>

                </div>

                <div class="icon-grid">
                    ${icons
                        .map(createIconCard)
                        .join("")}
                </div>

            </section>
        `;

    }


    /*
     * ---------------------------------------------------------
     * CREATE ICON CARD
     * ---------------------------------------------------------
     */

    function createIconCard(icon) {

        const className =
            icon.className ||
            `ak-icon-${icon.name}`;


        return `
            <button
                type="button"
                class="icon-card"
                data-icon-class="${escapeHtml(className)}"
                title="Click to copy ${escapeHtml(className)}"
            >

                <span class="icon-preview">

                    <i
                        class="ak-icon ${escapeHtml(className)}"
                        aria-hidden="true"
                    ></i>

                </span>

                <span class="icon-name">
                    ${escapeHtml(icon.name)}
                </span>

                <span class="icon-class">
                    .${escapeHtml(className)}
                </span>

            </button>
        `;

    }


    /*
     * ---------------------------------------------------------
     * COPY ICON CLASS
     * ---------------------------------------------------------
     */

    async function copyIconClass(className) {

        try {

            await navigator.clipboard.writeText(
                className
            );

            showToast(
                `Copied: .${className}`
            );

        } catch (error) {

            /*
             * Fallback for browsers where
             * Clipboard API is unavailable.
             */

            const textarea =
                document.createElement("textarea");

            textarea.value =
                className;

            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

            showToast(
                `Copied: .${className}`
            );

        }

    }


    /*
     * ---------------------------------------------------------
     * CARD CLICK
     * ---------------------------------------------------------
     */

    contentElement.addEventListener(
        "click",
        event => {

            const card =
                event.target.closest(
                    ".icon-card"
                );

            if (!card) {

                return;

            }

            const className =
                card.dataset.iconClass;

            if (!className) {

                return;

            }

            copyIconClass(
                className
            );

        }
    );


    /*
     * ---------------------------------------------------------
     * SEARCH
     * ---------------------------------------------------------
     */

    searchInput.addEventListener(
        "input",
        event => {

            state.search =
                event.target.value;

            renderContent();

            updateToolbarCount();

        }
    );


    /*
     * ---------------------------------------------------------
     * TOOLBAR COUNT
     * ---------------------------------------------------------
     */

    function updateToolbarCount() {

        const icons =
            getFilteredIcons();

        const total =
            state.icons.length;

        const current =
            icons.length;


        if (state.search.trim()) {

            toolbarCount.innerHTML = `
                <strong>
                    ${current}
                </strong>
                of
                <strong>
                    ${total}
                </strong>
                icons
            `;

            return;

        }


        if (state.activeGroup === "all") {

            toolbarCount.innerHTML = `
                <strong>
                    ${total}
                </strong>
                icons
            `;

            return;

        }


        const groupTotal =
            state.groups[
                state.activeGroup
            ]?.length || 0;


        toolbarCount.innerHTML = `
            <strong>
                ${groupTotal}
            </strong>
            icons
        `;
